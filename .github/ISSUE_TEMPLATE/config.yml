# ==============================================================================
# 概要:
# - GitHub Issue テンプレート（Issue Forms）の表示制御を行います。
#
# 主な仕様・機能:
# - Issue 作成画面での「空の Issue」可否を設定します。
# - 必要に応じて問い合わせ先リンク（contact_links）を提示できます。
#
# 制限事項:
# - contact_links の遷移先（Discussions など）が未設定の場合、リンクは機能しません。
# ==============================================================================

blank_issues_enabled: true
