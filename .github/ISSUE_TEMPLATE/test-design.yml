# ==============================================================================
# 概要:
# - テスト設計（ケース設計）用の Issue テンプレート（Issue Forms）です。
#
# 主な仕様・機能:
# - テスト範囲、観点、テストケース、テストデータ、環境、合否基準を整理できます。
#
# 制限事項:
# - 実際の実施結果・証跡は `テスト実施` テンプレートで管理してください。
# ==============================================================================

name: "テスト設計 🧪"
description: "テスト観点とケースを整理し、合否基準を明確にする"
title: "[テスト設計] "
labels:
  - "type:test-design"
body:
  - type: markdown
    attributes:
      value: |
        ## 目的
        この Issue は「どう検証するか」を事前に設計して、抜け漏れを防ぐためのテンプレートです。

  - type: input
    id: related-issue
    attributes:
      label: 対象Issue/PR
      description: "例: 要件 #123 / 実装 #456 / PR #789"
      placeholder: "#123"
    validations:
      required: true

  - type: textarea
    id: test-scope
    attributes:
      label: テスト範囲（対象/対象外）
      placeholder: |
        - 対象:
          - ...
        - 対象外:
          - ...
    validations:
      required: true

  - type: dropdown
    id: test-level
    attributes:
      label: テスト種別（主）
      options:
        - 単体テスト（Unit）
        - 結合テスト（Integration）
        - E2E（End-to-End）
        - 手動テスト（Manual）
        - 監視/運用テスト（Observability）
    validations:
      required: true

  - type: textarea
    id: test-points
    attributes:
      label: テスト観点（重要）
      description: "機能/境界値/異常系/権限/性能/互換性/回帰など"
      placeholder: |
        - 機能:
        - 境界値:
        - 異常系:
        - 権限:
        - 回帰:
    validations:
      required: true

  - type: textarea
    id: test-cases
    attributes:
      label: テストケース（表形式推奨）
      description: "ID/手順/期待結果/優先度/自動化可否 など。貼り付けでOK"
      placeholder: |
        | ID | 観点 | 手順 | 期待結果 | 優先度 | 自動化 |
        |---|---|---|---|---|---|
        | TC-001 | ... | ... | ... | P0 | Yes/No |
    validations:
      required: true

  - type: textarea
    id: test-data
    attributes:
      label: テストデータ
      description: "必要なユーザー/権限/レコード/外部連携のスタブなど"
      placeholder: |
        - ユーザー:
        - データ:
        - 外部連携:
    validations:
      required: false

  - type: textarea
    id: environments
    attributes:
      label: テスト環境 / 前提
      description: "検証環境、ブランチ/ビルド、設定、Feature Flag など"
      placeholder: |
        - 環境:
        - ブランチ/コミット:
        - 設定/フラグ:
    validations:
      required: true

  - type: textarea
    id: pass-fail
    attributes:
      label: 合否基準（Go/No-Go）
      description: "何が満たされれば合格か、重大バグの扱いなど"
      placeholder: |
        - P0 のテストケースが全てPass
        - 重大度Highの不具合が0件
    validations:
      required: true
