# /**
#  * ファイル概要:
#  * - 親チケット（Issueタイトル先頭が「【親】」）の作成をトリガーに、子チケットを自動生成する GitHub Actions Workflow。
#  *
#  * 主な仕様・機能:
#  * - Issue 作成イベント（opened）でのみ発火
#  * - タイトルが「【親】」で始まる場合のみ処理対象
#  * - 子チケットを以下の5種別で作成:
#  *   - [要件] / [設計] / [実装] / [テスト設計] / [テスト実施]
#  * - リレーションシップ（親子関係）作成:
#  *   - GitHub Issue の Relationships 機能（UIの「Add parent」相当）で親子関係を作成
#  *   - GraphQL mutation `addSubIssue` を使い、親Issueに子Issue（Sub-issue）を紐付ける
#  * - 重複作成防止:
#  *   - 親チケット本文内のHTMLコメント（目印）を使って判定（ラベルは使用しない）
#  *
#  * 制限事項:
#  * - 親チケットを「編集で【親】に変えた」場合は対象外（opened のみ）
#  * - 同名の子チケットが既に存在していても、本Workflowは本文目印がなければ作成します（目印を削除すると再作成され得ます）
#  */
name: Create Child Issues On Parent Opened

on:
  issues:
    types: [opened]

permissions:
  issues: write
  # GitHub Projects（Project v2）へアイテム追加/フィールド更新するために必要
  repository-projects: write

jobs:
  create-child-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create child issues when parent issue is opened
        uses: actions/github-script@v7
        env:
          # リポジトリ変数（Settings > Secrets and variables > Actions > Variables）で設定してください
          # - PROJECT_V2_ID: Project v2 の node_id
          # - PROJECT_V2_STATUS_FIELD_ID: Status フィールドの node_id
          # - PROJECT_V2_IN_PROGRESS_OPTION_ID: Status の "In Progress" option の node_id
          PROJECT_V2_ID: ${{ vars.PROJECT_V2_ID }}
          PROJECT_V2_STATUS_FIELD_ID: ${{ vars.PROJECT_V2_STATUS_FIELD_ID }}
          PROJECT_V2_IN_PROGRESS_OPTION_ID: ${{ vars.PROJECT_V2_IN_PROGRESS_OPTION_ID }}
        with:
          # 既定は GITHUB_TOKEN を使用します。
          # User/Org の Project v2 が GITHUB_TOKEN で更新できない場合は、
          # Secrets に PROJECT_V2_TOKEN（Classic PAT推奨: project / read:org / repo）を登録して使用してください。
          github-token: ${{ secrets.PROJECT_V2_TOKEN || github.token }}
          script: |
            /**
             * 親Issueかどうかを判定します。
             * @param {string} title Issueタイトル
             * @returns {boolean} 親Issueならtrue
             */
            function isParentIssueTitle(title) {
              return typeof title === "string" && title.trim().startsWith("【親】");
            }

            /**
             * 親Issueタイトルから子Issueのベースタイトルを作ります。
             * - 先頭の「【親】」と直後の空白を除去します。
             * @param {string} parentTitle 親Issueタイトル
             * @returns {string} 子Issueベースタイトル
             */
            function toBaseTitle(parentTitle) {
              return parentTitle.replace(/^【親】\s*/, "").trim();
            }

            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 親以外は何もしない
            if (!isParentIssueTitle(issue.title)) {
              core.info(`Skip: not a parent issue. title="${issue.title}"`);
              return;
            }

            const baseTitle = toBaseTitle(issue.title);
            if (!baseTitle) {
              core.warning(`Skip: baseTitle is empty. original title="${issue.title}"`);
              return;
            }

            const relationshipMarker = "<!-- 重複作成防止用の目印です。削除しないでください。 -->";
            const parentIssueId = issue.node_id;
            if (!parentIssueId) {
              core.warning(`Skip: parent issue node_id is missing. issue_number=#${issue.number}`);
              return;
            }

            const projectV2Id = process.env.PROJECT_V2_ID;
            const projectV2StatusFieldId = process.env.PROJECT_V2_STATUS_FIELD_ID;
            const projectV2InProgressOptionId = process.env.PROJECT_V2_IN_PROGRESS_OPTION_ID;

            // デバッグ: Variablesの読み込み状況を確認
            core.info(`DEBUG: PROJECT_V2_ID=${projectV2Id ? "SET" : "NOT SET"}`);
            core.info(`DEBUG: PROJECT_V2_STATUS_FIELD_ID=${projectV2StatusFieldId ? "SET" : "NOT SET"}`);
            core.info(`DEBUG: PROJECT_V2_IN_PROGRESS_OPTION_ID=${projectV2InProgressOptionId ? "SET" : "NOT SET"}`);

            // 重複防止：親本文に目印があれば終了
            const parentBody = typeof issue.body === "string" ? issue.body : "";
            if (parentBody.includes(relationshipMarker)) {
              core.info(`Skip: relationship marker already exists on parent issue #${issue.number}`);
              return;
            }

            const childDefinitions = [
              { prefix: "[要件]", templatePath: ".github/ISSUE_TEMPLATE/requirements.md" },
              { prefix: "[設計]", templatePath: ".github/ISSUE_TEMPLATE/design.md" },
              { prefix: "[実装]", templatePath: ".github/ISSUE_TEMPLATE/implementation.md" },
              { prefix: "[テスト設計]", templatePath: ".github/ISSUE_TEMPLATE/test-design.md" },
              { prefix: "[テスト実施]", templatePath: ".github/ISSUE_TEMPLATE/test-execution.md" },
            ];

            /**
             * Issue Forms形式またはマークダウンテンプレートファイルを読み込み、Markdown本文に変換します。
             * @param {string} templatePath テンプレートファイルのパス
             * @param {string} parentUrl 親Issue URL
             * @param {number} parentNumber 親Issue番号
             * @param {string} childBaseTitle 子Issueベースタイトル
             * @returns {Promise<string>} Markdown本文
             */
            async function loadTemplateBody(templatePath, parentUrl, parentNumber, childBaseTitle) {
              try {
                const fs = require("fs");
                const path = require("path");

                // テンプレートファイルの絶対パスを取得
                const workspacePath = process.env.GITHUB_WORKSPACE || ".";
                const fullTemplatePath = path.join(workspacePath, templatePath);

                // テンプレートファイルが存在するか確認
                if (!fs.existsSync(fullTemplatePath)) {
                  core.warning(`Template file not found: ${fullTemplatePath}. Using default body.`);
                  return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
                }

                const templateContent = fs.readFileSync(fullTemplatePath, "utf8");

                const sections = [];

                // 親チケット情報を先頭に追加
                sections.push(`親チケット: ${parentUrl}`);
                sections.push(``);
                sections.push(`- 親Issue番号: #${parentNumber}`);
                sections.push(`- 種別: ${childBaseTitle}`);
                sections.push(``);
                sections.push(`---`);
                sections.push(``);

                // マークダウンファイル（.md）の場合はフロントマターを除去して本文をそのまま使用
                if (templatePath.endsWith(".md")) {
                  // フロントマター（---で囲まれた部分）を除去
                  const frontMatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
                  const match = templateContent.match(frontMatterRegex);
                  const bodyContent = match ? match[2] : templateContent;
                  sections.push(bodyContent.trim());
                  sections.push(``);
                  sections.push(`---`);
                  sections.push(`※このIssueは自動生成です。`);
                  return sections.join("\n");
                }

                // Issue Forms形式（.yml）の場合は従来の処理

                // bodyセクションを抽出して解析
                const bodySectionMatch = templateContent.match(/^body:\s*\n((?:[ \t]+-.*\n?)+)/ms);
                if (bodySectionMatch) {
                  const bodySection = bodySectionMatch[1];

                  // 各アイテムを抽出（簡易的な正規表現ベースのパーサー）
                  const itemRegex = /^[ \t]+- type: (\w+)\s*\n((?:[ \t]+.*\n?)*)/gm;
                  let match;

                  while ((match = itemRegex.exec(bodySection)) !== null) {
                    const itemType = match[1];
                    const itemContent = match[2];

                    if (itemType === "markdown") {
                      // markdownセクションを抽出
                      const valueMatch = itemContent.match(/attributes:\s*\n[ \t]+value:\s*\|\s*\n((?:[ \t]+.*\n?)+)/);
                      if (valueMatch) {
                        const markdownContent = valueMatch[1]
                          .split("\n")
                          .map(line => line.replace(/^[ \t]+/, ""))
                          .filter(line => line.trim() || line === "")
                          .join("\n");
                        sections.push(markdownContent.trim());
                        sections.push(``);
                      }
                    } else if (itemType === "textarea" || itemType === "input") {
                      // textarea/inputフィールドを抽出
                      const labelMatch = itemContent.match(/attributes:\s*\n[ \t]+label:\s*["']?([^"'\n]+)["']?/);
                      const descMatch = itemContent.match(/description:\s*["']?([^"'\n]+)["']?/);

                      // ラベルが見つからない場合はスキップ
                      if (!labelMatch) {
                        continue;
                      }

                      const label = labelMatch[1];
                      const description = descMatch ? descMatch[1] : "";

                      sections.push(`### ${label}`);
                      if (description) {
                        sections.push(`${description}`);
                      }
                      // 入力欄は空のまま（プレースホルダーやコメントは追加しない）
                      sections.push(``);
                    } else if (itemType === "dropdown") {
                      // dropdownフィールドを抽出
                      const labelMatch = itemContent.match(/attributes:\s*\n[ \t]+label:\s*["']?([^"'\n]+)["']?/);
                      const descMatch = itemContent.match(/description:\s*["']?([^"'\n]+)["']?/);
                      const optionsMatch = itemContent.match(/options:\s*\n((?:[ \t]+-.*\n?)+)/);

                      // ラベルが見つからない場合はスキップ
                      if (!labelMatch) {
                        continue;
                      }

                      const label = labelMatch[1];
                      const description = descMatch ? descMatch[1] : "";

                      sections.push(`### ${label}`);
                      if (description) {
                        sections.push(`${description}`);
                      }
                      if (optionsMatch) {
                        const options = optionsMatch[1]
                          .split("\n")
                          .map(line => line.match(/[ \t]+- (.+)/))
                          .filter(Boolean)
                          .map(m => m[1]);
                        if (options.length > 0) {
                          sections.push(``);
                          sections.push("選択肢:");
                          options.forEach(opt => {
                            sections.push(`- ${opt}`);
                          });
                        }
                      }
                      // 選択欄は空のまま（コメントは追加しない）
                      sections.push(``);
                    } else if (itemType === "checkboxes") {
                      // checkboxesフィールドを抽出
                      const labelMatch = itemContent.match(/attributes:\s*\n[ \t]+label:\s*["']?([^"'\n]+)["']?/);
                      const optionsMatch = itemContent.match(/options:\s*\n((?:[ \t]+-.*\n?)+)/);

                      // ラベルが見つからない場合はスキップ
                      if (!labelMatch) {
                        continue;
                      }

                      const label = labelMatch[1];

                      sections.push(`### ${label}`);
                      sections.push(``);
                      if (optionsMatch) {
                        const options = optionsMatch[1]
                          .split("\n")
                          .map(line => {
                            const optMatch = line.match(/[ \t]+- label:\s*["']?([^"'\n]+)["']?/);
                            return optMatch ? optMatch[1] : null;
                          })
                          .filter(Boolean);
                        options.forEach(opt => {
                          sections.push(`- [ ] ${opt}`);
                        });
                      }
                      sections.push(``);
                    }
                  }
                } else {
                  // bodyセクションが見つからない場合はデフォルト本文を使用
                  core.warning(`Template body section not found: ${templatePath}. Using default body.`);
                  return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
                }

                sections.push(``);
                sections.push(`---`);
                sections.push(`※このIssueは自動生成です。`);

                return sections.join("\n");
              } catch (e) {
                core.error(`Failed to load template: ${templatePath}. Error: ${e.message}`);
                core.error(`Stack: ${e.stack}`);
                return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
              }
            }

            /**
             * デフォルトの子Issue本文を生成します（テンプレートが使用できない場合のフォールバック）。
             * @param {string} parentUrl 親Issue URL
             * @param {number} parentNumber 親Issue番号
             * @param {string} childBaseTitle 子Issueベースタイトル
             * @returns {string} Markdown本文
             */
            function buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle) {
              return [
                `親チケット: ${parentUrl}`,
                ``,
                `- 親Issue番号: #${parentNumber}`,
                `- 種別: ${childBaseTitle}`,
                ``,
                `## 概要`,
                `${childBaseTitle}`,
                ``,
                `## 進め方（例）`,
                `- TODOを書き出す`,
                `- 完了条件を明確化する`,
                ``,
                `---`,
                `※このIssueは自動生成です。`,
              ].join("\n");
            }

            // 子Issue作成（親Issueのアサインのみ引き継ぐ。ラベルは一切付与しない）
            const parentAssignees = (issue.assignees ?? []).map((a) => a?.login).filter(Boolean);

            /** @type {{prefix: string, number: number, html_url: string, title: string}[]} */
            const createdChildren = [];

            /**
             * Issue/PR を Project v2 に追加します。
             * @param {string} projectId Project v2 の node_id
             * @param {string} contentId Issue/PR の node_id
             * @returns {Promise<string>} 追加された itemId
             */
            async function addToProjectV2(projectId, contentId) {
              const mutation = `
                mutation AddProjectV2ItemById($input: AddProjectV2ItemByIdInput!) {
                  addProjectV2ItemById(input: $input) {
                    item { id }
                  }
                }
              `;

              const res = await github.graphql(mutation, {
                input: {
                  projectId,
                  contentId,
                },
              });

              return res?.addProjectV2ItemById?.item?.id;
            }

            /**
             * Project v2 の単一選択フィールド（例: Status）を更新します。
             * @param {string} projectId Project v2 の node_id
             * @param {string} itemId Project item の node_id
             * @param {string} fieldId フィールドの node_id
             * @param {string} optionId 選択肢の node_id
             * @returns {Promise<void>}
             */
            async function setProjectV2SingleSelectField(projectId, itemId, fieldId, optionId) {
              const mutation = `
                mutation UpdateProjectV2ItemFieldValue($input: UpdateProjectV2ItemFieldValueInput!) {
                  updateProjectV2ItemFieldValue(input: $input) {
                    projectV2Item { id }
                  }
                }
              `;

              await github.graphql(mutation, {
                input: {
                  projectId,
                  itemId,
                  fieldId,
                  value: {
                    singleSelectOptionId: optionId,
                  },
                },
              });
            }

            /**
             * 親子関係（Relationshipsの親子）を作成します。
             * @param {string} parentId 親IssueのGraphQL node_id
             * @param {string} subIssueId 子IssueのGraphQL node_id
             * @returns {Promise<void>}
             */
            async function linkSubIssue(parentId, subIssueId) {
              const mutation = `
                mutation AddSubIssue($input: AddSubIssueInput!) {
                  addSubIssue(input: $input) {
                    issue { id number }
                    subIssue { id number }
                  }
                }
              `;

              await github.graphql(mutation, {
                input: {
                  issueId: parentId,
                  subIssueId,
                },
              });
            }

            // 親Issueを同じプロジェクトへ追加（設定されていない場合はスキップ）
            if (projectV2Id) {
              try {
                core.info(`DEBUG: Adding parent issue #${issue.number} to Project v2...`);
                await addToProjectV2(projectV2Id, parentIssueId);
                core.info(`DEBUG: Successfully added parent issue #${issue.number} to Project v2.`);
              } catch (e) {
                core.error(`Failed to add parent issue to Project v2. issue=#${issue.number}, status=${e?.status ?? "unknown"}, message=${e?.message ?? "unknown"}`);
                if (e?.errors) {
                  core.error(`GraphQL errors: ${JSON.stringify(e.errors)}`);
                }
              }
            } else {
              core.info("Skip: PROJECT_V2_ID is not set. Project linking is disabled.");
            }

            for (const def of childDefinitions) {
              const childTitle = `${def.prefix}${baseTitle}`;
              const body = await loadTemplateBody(
                def.templatePath,
                issue.html_url,
                issue.number,
                baseTitle
              );

              const created = await github.rest.issues.create({
                owner,
                repo,
                title: childTitle,
                body,
                assignees: parentAssignees,
              });

              const childIssueId = created.data.node_id;
              if (!childIssueId) {
                throw new Error(`Child issue node_id is missing. issue_number=#${created.data.number}`);
              }

              // Relationships（Add parent相当）で親子関係を作成
              await linkSubIssue(parentIssueId, childIssueId);

              // 子Issueを同じプロジェクトへ追加し、Status を In Progress にする（設定されている場合のみ）
              if (projectV2Id) {
                try {
                  core.info(`DEBUG: Adding child issue #${created.data.number} to Project v2...`);
                  const itemId = await addToProjectV2(projectV2Id, childIssueId);
                  if (!itemId) {
                    core.warning(`Project itemId is missing for child issue. issue=#${created.data.number}`);
                  } else if (projectV2StatusFieldId && projectV2InProgressOptionId) {
                    core.info(`DEBUG: Setting Status to In Progress for child issue #${created.data.number}...`);
                    await setProjectV2SingleSelectField(
                      projectV2Id,
                      itemId,
                      projectV2StatusFieldId,
                      projectV2InProgressOptionId
                    );
                    core.info(`DEBUG: Successfully set Status to In Progress for child issue #${created.data.number}.`);
                  } else {
                    core.info("Skip: PROJECT_V2_STATUS_FIELD_ID or PROJECT_V2_IN_PROGRESS_OPTION_ID is not set. Status update is disabled.");
                  }
                } catch (e) {
                  core.error(`Failed to add/update child issue in Project v2. issue=#${created.data.number}, status=${e?.status ?? "unknown"}, message=${e?.message ?? "unknown"}`);
                  if (e?.errors) {
                    core.error(`GraphQL errors: ${JSON.stringify(e.errors)}`);
                  }
                }
              }

              createdChildren.push({
                prefix: def.prefix,
                number: created.data.number,
                html_url: created.data.html_url,
                title: created.data.title,
              });
            }

            /**
             * 親Issue本文へ、重複作成防止用の目印（HTMLコメント）だけを追記します。
             * @param {string} currentBody 現在の親本文
             * @param {string} marker 目印
             * @returns {string} 更新後本文
             */
            function appendRelationshipMarker(currentBody, marker) {
              const trimmed = (currentBody ?? "").trimEnd();
              if (!trimmed) return `${marker}\n`;
              return trimmed.includes(marker) ? `${trimmed}\n` : `${trimmed}\n\n\n\n\n\n${marker}\n`;
            }

            const updatedParentBody = appendRelationshipMarker(parentBody, relationshipMarker);

            // 親Issueを更新（重複作成防止の目印を保存するため。親子関係自体は addSubIssue で作成済み）
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: updatedParentBody,
            });
