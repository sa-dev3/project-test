# /**
#  * 【このファイルの概要】
#  * このファイルは、GitHub Actionsのワークフローファイルです。
#  * タイトルの先頭が「【親】」で始まるIssueが作成されたときに、自動的に5つの子Issueを作成します。
#  *
#  * 【動作の流れ】
#  * 1. 誰かが「【親】新機能を追加する」のようなタイトルでIssueを作成します
#  * 2. このワークフローが自動的に実行されます
#  * 3. 以下の5つの子Issueが自動的に作成されます:
#  *    - [要件]新機能を追加する
#  *    - [設計]新機能を追加する
#  *    - [実装]新機能を追加する
#  *    - [テスト設計]新機能を追加する
#  *    - [テスト実施]新機能を追加する
#  * 4. 親Issueと子Issueの親子関係が自動的に作成されます
#  *
#  * 【主な機能】
#  * - Issueが作成されたとき（opened）にのみ動作します
#  * - タイトルが「【親】」で始まる場合のみ処理します
#  * - 子Issueには、親Issueと同じ担当者（アサイン）が自動的に割り当てられます
#  * - 親Issueと子Issueの親子関係を自動的に作成します（GitHubのUIで「Add parent」を押したのと同じ効果）
#  * - 同じ親Issueから子Issueが重複して作成されないように、目印（HTMLコメント）を使用します
#  *
#  * 【注意事項】
#  * - 既に作成済みのIssueのタイトルを「【親】」に変更しても、このワークフローは動作しません
#  *    （新規作成時のみ動作します）
#  * - 親Issueの本文に目印が含まれている場合、子Issueは作成されません（重複防止）
#  * - 目印を削除すると、再度子Issueが作成される可能性があります
#  */
name: Auto Create Child Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  # GitHub Projects（Project v2）へアイテム追加/フィールド更新するために必要
  repository-projects: write

jobs:
  create-child-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create child issues when parent issue is opened
        uses: actions/github-script@v7
        env:
          # リポジトリ変数（Settings > Secrets and variables > Actions > Variables）で設定してください
          # - PROJECT_V2_ID: Project v2 の node_id
          # - PROJECT_V2_STATUS_FIELD_ID: Status フィールドの node_id
          # - PROJECT_V2_IN_PROGRESS_OPTION_ID: Status の "In Progress" option の node_id
          PROJECT_V2_ID: ${{ vars.PROJECT_V2_ID }}
          PROJECT_V2_STATUS_FIELD_ID: ${{ vars.PROJECT_V2_STATUS_FIELD_ID }}
          PROJECT_V2_IN_PROGRESS_OPTION_ID: ${{ vars.PROJECT_V2_IN_PROGRESS_OPTION_ID }}
        with:
          # 既定は GITHUB_TOKEN を使用します。
          # User/Org の Project v2 が GITHUB_TOKEN で更新できない場合は、
          # Secrets に PROJECT_V2_TOKEN（Classic PAT推奨: project / read:org / repo）を登録して使用してください。
          github-token: ${{ secrets.PROJECT_V2_TOKEN || github.token }}
          script: |
            /**
             * このIssueが親Issueかどうかを判定する関数です。
             * 親Issueは、タイトルの先頭が「【親】」で始まるIssueです。
             *
             * @param {string} title - 判定するIssueのタイトル
             * @returns {boolean} - 親Issueの場合はtrue、そうでない場合はfalse
             */
            function isParentIssueTitle(title) {
              return typeof title === "string" && title.trim().startsWith("【親】");
            }

            /**
             * 親Issueのタイトルから、子Issueのタイトルに使うベース部分を抽出する関数です。
             * 例：「【親】新機能を追加する」→「新機能を追加する」
             *
             * @param {string} parentTitle - 親Issueのタイトル
             * @returns {string} - 「【親】」とその後の空白を削除した文字列
             */
            function toBaseTitle(parentTitle) {
              return parentTitle.replace(/^【親】\s*/, "").trim();
            }

            // イベントから作成されたIssueの情報を取得します
            const issue = context.payload.issue;
            // リポジトリの所有者（ユーザー名または組織名）を取得します
            const owner = context.repo.owner;
            // リポジトリ名を取得します
            const repo = context.repo.repo;

            // このIssueが親Issueでない場合は、何もせずに処理を終了します
            // 親Issueはタイトルの先頭が「【親】」で始まるIssueです
            if (!isParentIssueTitle(issue.title)) {
              core.info(`Skip: not a parent issue. title="${issue.title}"`);
              return;
            }

            // 親Issueのタイトルから「【親】」を除去して、子Issueのベースタイトルを取得します
            const baseTitle = toBaseTitle(issue.title);
            // ベースタイトルが空の場合は、子Issueを作成できないので処理を終了します
            if (!baseTitle) {
              core.warning(`Skip: baseTitle is empty. original title="${issue.title}"`);
              return;
            }

            // 重複作成を防ぐための目印（HTMLコメント）を定義します
            // この目印が親Issueの本文に含まれている場合、既に子Issueが作成済みと判断します
            const relationshipMarker = "<!-- 重複作成防止用の目印です -->";

            // 親IssueのGraphQL node_idを取得します
            // node_idはGitHubのGraphQL APIでIssueを識別するために必要なIDです
            const parentIssueId = issue.node_id;
            if (!parentIssueId) {
              core.warning(`Skip: parent issue node_id is missing. issue_number=#${issue.number}`);
              return;
            }

            // Project v2の設定値を環境変数から取得
            // これらの値はリポジトリの設定（Settings > Secrets and variables > Actions > Variables）で設定します
            const projectV2Id = process.env.PROJECT_V2_ID;
            const projectV2StatusFieldId = process.env.PROJECT_V2_STATUS_FIELD_ID;
            const projectV2InProgressOptionId = process.env.PROJECT_V2_IN_PROGRESS_OPTION_ID;

            // 重複作成を防ぐため、親Issueの本文に目印（HTMLコメント）が既に含まれているか確認します
            // 目印があれば、既に子Issueが作成済みなので処理を終了します
            const parentBody = typeof issue.body === "string" ? issue.body : "";
            if (parentBody.includes(relationshipMarker)) {
              core.info(`Skip: relationship marker already exists on parent issue #${issue.number}`);
              return;
            }

            // 作成する子Issueの定義を配列で指定します
            // 各子Issueには、タイトルの接頭辞（prefix）と使用するテンプレートファイルのパスを指定します
            const childDefinitions = [
              { prefix: "[要件]", templatePath: ".github/ISSUE_TEMPLATE/requirements.md" },
              { prefix: "[設計]", templatePath: ".github/ISSUE_TEMPLATE/design.md" },
              { prefix: "[実装]", templatePath: ".github/ISSUE_TEMPLATE/implementation.md" },
              { prefix: "[テスト設計]", templatePath: ".github/ISSUE_TEMPLATE/test-design.md" },
              { prefix: "[テスト実施]", templatePath: ".github/ISSUE_TEMPLATE/test-execution.md" },
            ];

            /**
             * マークダウンテンプレートファイルを読み込んで、子Issueの本文を作成する関数です。
             * テンプレートファイルの先頭にあるフロントマター（---で囲まれた部分）を除去し、
             * 親Issueへのリンクを追加してから返します。
             *
             * @param {string} templatePath - テンプレートファイルのパス（例: ".github/ISSUE_TEMPLATE/requirements.md"）
             * @param {string} parentUrl - 親IssueのURL（使用されていませんが、互換性のため保持）
             * @param {number} parentNumber - 親Issueの番号（例: 123）
             * @param {string} childBaseTitle - 子Issueのベースタイトル
             * @returns {Promise<string>} - 子Issueの本文として使用するMarkdown文字列
             */
            async function loadTemplateBody(templatePath, parentUrl, parentNumber, childBaseTitle) {
              try {
                // ファイルシステムとパス操作のためのモジュールを読み込みます
                const fs = require("fs");
                const path = require("path");

                // GitHub Actionsのワークスペースのパスを取得します
                // ワークスペースは、リポジトリのコードがチェックアウトされているディレクトリです
                const workspacePath = process.env.GITHUB_WORKSPACE || ".";
                // テンプレートファイルの絶対パスを作成します
                const fullTemplatePath = path.join(workspacePath, templatePath);

                // テンプレートファイルが存在するか確認します
                // 存在しない場合は、デフォルトの本文を返します
                if (!fs.existsSync(fullTemplatePath)) {
                  core.warning(`Template file not found: ${fullTemplatePath}. Using default body.`);
                  return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
                }

                // テンプレートファイルの内容を読み込みます（UTF-8エンコーディング）
                const templateContent = fs.readFileSync(fullTemplatePath, "utf8");

                // 子Issueの本文を構成するための配列を用意します
                const sections = [];

                // 子Issueの本文の先頭に、親Issueへのリンクを追加します
                sections.push(`- 親チケット: #${parentNumber}`);
                sections.push(`---`);
                sections.push(``);

                // マークダウンファイル（.md）の場合の処理
                if (templatePath.endsWith(".md")) {
                  // フロントマター（---で囲まれた部分）を除去します
                  // フロントマターは、テンプレートファイルの先頭にあるメタデータ（name、about、titleなど）です
                  const frontMatterRegex = /^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/;
                  const match = templateContent.match(frontMatterRegex);
                  // フロントマターが見つかった場合はその後の本文を、見つからない場合は全体を使用します
                  const bodyContent = match ? match[2] : templateContent;
                  sections.push(bodyContent.trim());
                  sections.push(``);
                  sections.push(`---`);
                  sections.push(`※このIssueは自動生成です。`);
                  // 配列の要素を改行で結合して、最終的な本文文字列を返します
                  return sections.join("\n");
                }

                // .mdファイルでない場合は、デフォルトの本文を使用します
                core.warning(`Template file is not a markdown file: ${templatePath}. Using default body.`);
                return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
              } catch (e) {
                // エラーが発生した場合は、エラーログを出力してデフォルトの本文を返します
                core.error(`Failed to load template: ${templatePath}. Error: ${e.message}`);
                core.error(`Stack: ${e.stack}`);
                return buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle);
              }
            }

            /**
             * テンプレートファイルが読み込めなかった場合に使用する、デフォルトの子Issue本文を生成する関数です。
             * この関数は、テンプレートファイルが見つからない場合や、読み込みに失敗した場合のフォールバックとして使用されます。
             *
             * @param {string} parentUrl - 親IssueのURL
             * @param {number} parentNumber - 親Issueの番号（例: 123）
             * @param {string} childBaseTitle - 子Issueのベースタイトル
             * @returns {string} - デフォルトの子Issue本文（Markdown形式）
             */
            function buildDefaultChildBody(parentUrl, parentNumber, childBaseTitle) {
              return [
                `親チケット: ${parentUrl}`,
                ``,
                `- 親Issue番号: #${parentNumber}`,
                `- 種別: ${childBaseTitle}`,
                ``,
                `## 概要`,
                `${childBaseTitle}`,
                ``,
                `## 進め方（例）`,
                `- TODOを書き出す`,
                `- 完了条件を明確化する`,
                ``,
                `---`,
                `※このIssueは自動生成です。`,
              ].join("\n");
            }

            // 親Issueに割り当てられている担当者（アサイン）のリストを取得します
            // 子Issueにも同じ担当者を割り当てます（ラベルは引き継ぎません）
            const parentAssignees = (issue.assignees ?? []).map((a) => a?.login).filter(Boolean);

            // 作成された子Issueの情報を保存するための配列です
            // 現在は使用されていませんが、将来的な拡張のために保持しています
            /** @type {{prefix: string, number: number, html_url: string, title: string}[]} */
            const createdChildren = [];

            /**
             * IssueまたはPull RequestをGitHub Project v2に追加する関数です。
             * GraphQL APIを使用して、Project v2にアイテムを追加します。
             *
             * @param {string} projectId - Project v2のGraphQL node_id（識別子）
             * @param {string} contentId - 追加するIssueまたはPRのGraphQL node_id
             * @returns {Promise<string>} - Project v2に追加されたアイテムのID
             */
            async function addToProjectV2(projectId, contentId) {
              // GraphQLのmutation（変更操作）を定義します
              // このmutationは、Project v2に新しいアイテムを追加します
              const mutation = `
                mutation AddProjectV2ItemById($input: AddProjectV2ItemByIdInput!) {
                  addProjectV2ItemById(input: $input) {
                    item { id }
                  }
                }
              `;

              // GraphQL APIを呼び出して、Project v2にアイテムを追加します
              const res = await github.graphql(mutation, {
                input: {
                  projectId,
                  contentId,
                },
              });

              // 追加されたアイテムのIDを返します
              return res?.addProjectV2ItemById?.item?.id;
            }

            /**
             * Project v2の単一選択フィールド（例: Statusフィールド）の値を更新する関数です。
             * 例えば、Statusフィールドを「In Progress」に設定する場合に使用します。
             *
             * @param {string} projectId - Project v2のGraphQL node_id
             * @param {string} itemId - 更新するProjectアイテムのGraphQL node_id
             * @param {string} fieldId - 更新するフィールドのGraphQL node_id
             * @param {string} optionId - 設定する選択肢のGraphQL node_id（例: "In Progress"のID）
             * @returns {Promise<void>} - 更新が完了するまで待機します
             */
            async function setProjectV2SingleSelectField(projectId, itemId, fieldId, optionId) {
              // GraphQLのmutationを定義します
              // このmutationは、Project v2アイテムのフィールド値を更新します
              const mutation = `
                mutation UpdateProjectV2ItemFieldValue($input: UpdateProjectV2ItemFieldValueInput!) {
                  updateProjectV2ItemFieldValue(input: $input) {
                    projectV2Item { id }
                  }
                }
              `;

              // GraphQL APIを呼び出して、フィールド値を更新します
              await github.graphql(mutation, {
                input: {
                  projectId,
                  itemId,
                  fieldId,
                  value: {
                    singleSelectOptionId: optionId,
                  },
                },
              });
            }

            /**
             * 親Issueと子Issueの親子関係を作成する関数です。
             * GitHubのRelationships機能を使用して、親Issueと子Issueを紐付けます。
             * これにより、GitHubのUIで「Add parent」ボタンを押したのと同じ効果が得られます。
             *
             * @param {string} parentId - 親IssueのGraphQL node_id
             * @param {string} subIssueId - 子IssueのGraphQL node_id
             * @returns {Promise<void>} - 親子関係の作成が完了するまで待機します
             */
            async function linkSubIssue(parentId, subIssueId) {
              // GraphQLのmutationを定義します
              // このmutationは、親Issueに子Issueを紐付けます
              const mutation = `
                mutation AddSubIssue($input: AddSubIssueInput!) {
                  addSubIssue(input: $input) {
                    issue { id number }
                    subIssue { id number }
                  }
                }
              `;

              // GraphQL APIを呼び出して、親子関係を作成します
              await github.graphql(mutation, {
                input: {
                  issueId: parentId,
                  subIssueId,
                },
              });
            }

            // 親IssueをProject v2に追加します（設定されている場合のみ）
            // PROJECT_V2_IDが設定されていない場合は、この処理をスキップします
            if (projectV2Id) {
              try {
                await addToProjectV2(projectV2Id, parentIssueId);
              } catch (e) {
                // Project v2への追加に失敗した場合は、エラーログを出力しますが処理は続行します
                core.error(`Failed to add parent issue to Project v2. issue=#${issue.number}, status=${e?.status ?? "unknown"}, message=${e?.message ?? "unknown"}`);
                if (e?.errors) {
                  core.error(`GraphQL errors: ${JSON.stringify(e.errors)}`);
                }
              }
            } else {
              core.info("Skip: PROJECT_V2_ID is not set. Project linking is disabled.");
            }

            // 定義されたすべての子Issueを作成します
            for (const def of childDefinitions) {
              // 子Issueのタイトルを作成します（例: "[要件]新機能を追加する"）
              const childTitle = `${def.prefix}${baseTitle}`;

              // テンプレートファイルを読み込んで、子Issueの本文を作成します
              const body = await loadTemplateBody(
                def.templatePath,
                issue.html_url,
                issue.number,
                baseTitle
              );

              // GitHub REST APIを使用して、子Issueを作成します
              const created = await github.rest.issues.create({
                owner,
                repo,
                title: childTitle,
                body,
                assignees: parentAssignees,
              });

              // 作成された子IssueのGraphQL node_idを取得します
              const childIssueId = created.data.node_id;
              if (!childIssueId) {
                throw new Error(`Child issue node_id is missing. issue_number=#${created.data.number}`);
              }

              // 親Issueと子Issueの親子関係を作成します
              // これにより、GitHubのUIで親子関係が表示されるようになります
              await linkSubIssue(parentIssueId, childIssueId);

              // 子IssueをProject v2に追加し、Statusを「In Progress」に設定します（設定されている場合のみ）
              if (projectV2Id) {
                try {
                  // 子IssueをProject v2に追加します
                  const itemId = await addToProjectV2(projectV2Id, childIssueId);
                  if (!itemId) {
                    core.warning(`Project itemId is missing for child issue. issue=#${created.data.number}`);
                  } else if (projectV2StatusFieldId && projectV2InProgressOptionId) {
                    // Statusフィールドと「In Progress」オプションのIDが設定されている場合、
                    // 子IssueのStatusを「In Progress」に設定します
                    await setProjectV2SingleSelectField(
                      projectV2Id,
                      itemId,
                      projectV2StatusFieldId,
                      projectV2InProgressOptionId
                    );
                  } else {
                    core.info("Skip: PROJECT_V2_STATUS_FIELD_ID or PROJECT_V2_IN_PROGRESS_OPTION_ID is not set. Status update is disabled.");
                  }
                } catch (e) {
                  // Project v2への追加やStatusの更新に失敗した場合は、エラーログを出力しますが処理は続行します
                  core.error(`Failed to add/update child issue in Project v2. issue=#${created.data.number}, status=${e?.status ?? "unknown"}, message=${e?.message ?? "unknown"}`);
                  if (e?.errors) {
                    core.error(`GraphQL errors: ${JSON.stringify(e.errors)}`);
                  }
                }
              }

              // 作成された子Issueの情報を配列に保存します（将来の拡張用）
              createdChildren.push({
                prefix: def.prefix,
                number: created.data.number,
                html_url: created.data.html_url,
                title: created.data.title,
              });
            }

            /**
             * 親Issueの本文に、重複作成防止用の目印（HTMLコメント）を追加する関数です。
             * この目印により、同じ親Issueから子Issueが重複して作成されることを防ぎます。
             *
             * @param {string} currentBody - 現在の親Issueの本文
             * @param {string} marker - 追加する目印（HTMLコメント）
             * @returns {string} - 目印が追加された後の本文
             */
            function appendRelationshipMarker(currentBody, marker) {
              // 本文の末尾の空白を除去します
              const trimmed = (currentBody ?? "").trimEnd();
              // 本文が空の場合は、目印だけを返します
              if (!trimmed) return `${marker}\n`;
              // 既に目印が含まれている場合は、そのまま返します
              // 含まれていない場合は、改行を追加してから目印を追加します
              return trimmed.includes(marker) ? `${trimmed}\n` : `${trimmed}\n\n\n\n\n\n${marker}\n`;
            }

            // 親Issueの本文に目印を追加します
            const updatedParentBody = appendRelationshipMarker(parentBody, relationshipMarker);

            // 親Issueの本文を更新します
            // これにより、重複作成防止用の目印が保存され、次回同じ親Issueが開かれたときに
            // 子Issueが重複して作成されることを防ぎます
            // 注意: 親子関係自体は、先ほど実行したlinkSubIssue関数で既に作成済みです
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              body: updatedParentBody,
            });
