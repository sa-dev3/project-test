## -----------------------------------------------------------------------------
## このWorkflowの概要
## - GitHub Issue が「新規作成（opened）」されたタイミングで自動実行されます
## - 新しく起票された Issue に対して、テンプレート案内のコメントを投稿します
##
## 主な仕様・機能
## - Issue 作成イベント（opened）でのみ発火
## - actions/github-script を使って GitHub API から Issue コメントを作成
##
## 制限事項
## - 「Issue を開いた」場合のみ対象です（編集/再オープン等では動きません）
## - コメント本文はこのファイル内の文字列をそのまま投稿します（i18n等なし）
## - 権限が不足しているとコメント投稿に失敗します（permissions を要確認）
## -----------------------------------------------------------------------------

name: On Issue Opened

on:
  issues:
    # Issue に関するイベント種別のうち、今回は「新規作成された」時だけを対象にする
    types: [opened]

permissions:
  # このWorkflowが Issue にコメント投稿するために必要な権限
  # 最小権限の原則で、issues: write のみに絞っています
  issues: write

jobs:
  # jobs は「やりたい処理のまとまり」です（複数ジョブも作れます）
  comment:
    # GitHub が用意してくれる Ubuntu 環境で実行します
    runs-on: ubuntu-latest
    steps:
      - name: Comment on new issue
        # actions/github-script:
        # - JavaScript で短い処理を書くのに便利な公式アクション
        # - github / context などが注入され、GitHub API を呼び出せます
        uses: actions/github-script@v7
        with:
          script: |
            // context.payload にはイベントの情報（今回だと Issue の情報）が入っています
            const    = context.payload.issue;

            // GitHub REST API で「Issue にコメントを作成」します
            // owner/repo はこのWorkflowが動いているリポジトリ情報です
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              // コメント本文（Markdown可）
              // \n は改行です
              body: `起票ありがとう！👀\n\n- 再現手順\n- 期待結果 / 実結果\n- 影響範囲\n\nを追記してくれると助かる。`
            });
